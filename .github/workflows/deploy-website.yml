# Builds bluesquare-next and deploys it to Cloud Run on every push to main
# that touches the website. Auth is keyless (Workload Identity Federation).
name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - "bluesquare-next/**"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:

concurrency:
  group: deploy-website
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: europe-west1
  SERVICE: bluesquare-website
  IMAGE: europe-west1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/bluesquare/bluesquare-website:${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push image
        working-directory: bluesquare-next
        run: |
          gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet
          docker build \
            --build-arg NEXT_PUBLIC_SITE_URL="${{ vars.NEXT_PUBLIC_SITE_URL || 'https://bluesquare.ai' }}" \
            --build-arg NEXT_PUBLIC_ANALYTICS_URL="${{ vars.NEXT_PUBLIC_ANALYTICS_URL }}" \
            --build-arg NEXT_PUBLIC_ANALYTICS_SITE_ID="${{ vars.NEXT_PUBLIC_ANALYTICS_SITE_ID }}" \
            -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --image "$IMAGE" \
            --service-account "website-runtime@$PROJECT_ID.iam.gserviceaccount.com" \
            --port 8080 \
            --memory 512Mi \
            --min-instances 0 \
            --max-instances 3 \
            --quiet
