# Builds bluesquare-analytics and deploys it to Cloud Run (bs-analytics) on every push to main
# that touches the app. Auth is keyless (Workload Identity Federation). The service keeps its
# env vars, secrets and Cloud SQL connection; only the image changes.
name: Deploy analytics

on:
  push:
    branches: [main]
    paths:
      - "bluesquare-analytics/**"
      - ".github/workflows/deploy-analytics.yml"
  workflow_dispatch:

concurrency:
  group: deploy-analytics
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: europe-west1
  SERVICE: bs-analytics
  IMAGE: europe-west1-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/bluesquare/bs-analytics:${{ github.sha }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA_ANALYTICS }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Build and push image
        working-directory: bluesquare-analytics
        run: |
          gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy "$SERVICE" \
            --project "$PROJECT_ID" \
            --region "$REGION" \
            --image "$IMAGE" \
            --quiet
